name: Validate Manifests

on:
  pull_request:
    paths:
      - "config/**"
      - "apps/**"

jobs:
  validate:
    name: Kustomize Build + Schema Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [hello-world, sample-app-2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Render ${{ matrix.app }}
        run: kustomize build config/${{ matrix.app }} -o /tmp/${{ matrix.app }}.yaml

      - name: Schema validate (kubeconform)
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -kubernetes-version 1.31.0
            -summary
            /tmp/${{ matrix.app }}.yaml

  validate-argocd-apps:
    name: Validate ArgoCD Application CRDs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate apps/ ArgoCD CRDs
        run: |
          kubectl apply --dry-run=client \
            --schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -f apps/
